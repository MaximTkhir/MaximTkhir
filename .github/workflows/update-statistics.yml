name: Update Development Statistics

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write

env:
  # Manual development records.
  # Update these values when your archive changes.
  PRIVATE_REPOS: "53"
  PROJECTS_BUILT: "17"

jobs:
  update-statistics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Collect GitHub statistics
        id: stats
        shell: bash
        run: |
          USERNAME="${{ github.repository_owner }}"

          PUBLIC_REPOS=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/$USERNAME" \
            | jq -r '.public_repos')

          if ! [[ "$PUBLIC_REPOS" =~ ^[0-9]+$ ]]; then
            echo "Failed to retrieve public repository count."
            exit 1
          fi

          if ! [[ "$PRIVATE_REPOS" =~ ^[0-9]+$ ]]; then
            echo "PRIVATE_REPOS must be a number."
            exit 1
          fi

          if ! [[ "$PROJECTS_BUILT" =~ ^[0-9]+$ ]]; then
            echo "PROJECTS_BUILT must be a number."
            exit 1
          fi

          TOTAL_REPOS=$((PUBLIC_REPOS + PRIVATE_REPOS))
          
          FEATURED_PROJECTS=$(grep -E '^### PROJECT [0-9]+' README.md | wc -l)

          printf -v PUBLIC_REPOS_PADDED "%02d" "$PUBLIC_REPOS"
          printf -v PRIVATE_REPOS_PADDED "%02d" "$PRIVATE_REPOS"
          printf -v TOTAL_REPOS_PADDED "%02d" "$TOTAL_REPOS"
          printf -v FEATURED_PROJECTS_PADDED "%02d" "$FEATURED_PROJECTS"
          printf -v PROJECTS_BUILT_PADDED "%02d" "$PROJECTS_BUILT"

          echo "public_repos=$PUBLIC_REPOS_PADDED" >> "$GITHUB_OUTPUT"
          echo "private_repos=$PRIVATE_REPOS_PADDED" >> "$GITHUB_OUTPUT"
          echo "total_repos=$TOTAL_REPOS_PADDED" >> "$GITHUB_OUTPUT"
          echo "featured_projects=$FEATURED_PROJECTS_PADDED" >> "$GITHUB_OUTPUT"
          echo "projects_built=$PROJECTS_BUILT_PADDED" >> "$GITHUB_OUTPUT"

          echo "Public repositories:  $PUBLIC_REPOS_PADDED"
          echo "Private repositories: $PRIVATE_REPOS_PADDED"
          echo "Total repositories:   $TOTAL_REPOS_PADDED"
          echo "Featured projects:     $FEATURED_PROJECTS_PADDED"
          echo "Projects built:        $PROJECTS_BUILT_PADDED"
           
      - name: Count public code lines
        id: code
        shell: bash
        run: |
          set -euo pipefail

          USERNAME="${{ github.repository_owner }}"
          WORKDIR="$RUNNER_TEMP/observermt-public-repos"

          mkdir -p "$WORKDIR"

          echo "Fetching public repositories for $USERNAME..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$USERNAME/repos?type=owner&per_page=100" \
            > "$WORKDIR/repos.json"

          mapfile -t REPOS < <(
            jq -r '
              .[]
              | select(.fork == false)
              | .clone_url
            ' "$WORKDIR/repos.json"
          )

          TOTAL_LINES=0
          COUNTED_REPOS=0

          for REPO_URL in "${REPOS[@]}"; do
            REPO_NAME="$(basename "$REPO_URL" .git)"

            # The profile repository contains this README/statistics system,
            # not a development project. Do not count it as source code.
            if [[ "$REPO_NAME" == "$USERNAME" ]]; then
              echo "Skipping profile repository: $REPO_NAME"
              continue
            fi

            echo "Analyzing: $REPO_NAME"

            REPO_DIR="$WORKDIR/$REPO_NAME"

            if ! git clone \
              --depth 1 \
              --quiet \
              "$REPO_URL" \
              "$REPO_DIR"; then
              echo "Warning: failed to clone $REPO_NAME"
              continue
            fi

            REPO_LINES=$(
              find "$REPO_DIR" \
                -type d \( \
                  -name .git \
                  -o -name .github \
                  -o -name node_modules \
                  -o -name bin \
                  -o -name obj \
                  -o -name dist \
                  -o -name build \
                  -o -name coverage \
                  -o -name .next \
                  -o -name vendor \
                  -o -name packages \
                \) -prune \
                -o \
                -type f \( \
                  -name '*.luau' \
                  -o -name '*.lua' \
                  -o -name '*.cs' \
                  -o -name '*.py' \
                  -o -name '*.js' \
                  -o -name '*.jsx' \
                  -o -name '*.ts' \
                  -o -name '*.tsx' \
                  -o -name '*.java' \
                  -o -name '*.c' \
                  -o -name '*.h' \
                  -o -name '*.cpp' \
                  -o -name '*.hpp' \
                  -o -name '*.php' \
                  -o -name '*.go' \
                  -o -name '*.kt' \
                  -o -name '*.kts' \
                  -o -name '*.sql' \
                  -o -name '*.pas' \
                  -o -name '*.bsl' \
                  -o -name '*.ino' \
                  -o -name '*.html' \
                  -o -name '*.htm' \
                  -o -name '*.css' \
                  -o -name '*.scss' \
                  -o -name '*.sass' \
                \) \
                -print0 \
              | xargs -0 -r wc -l \
              | awk '
                  $2 != "total" { sum += $1 }
                  END { print sum + 0 }
                '
            )

            echo "  Code lines: $REPO_LINES"

            TOTAL_LINES=$((TOTAL_LINES + REPO_LINES))
            COUNTED_REPOS=$((COUNTED_REPOS + 1))

            rm -rf "$REPO_DIR"
          done

          echo "--------------------------------"
          echo "Repositories analyzed: $COUNTED_REPOS"
          echo "Public code lines:      $TOTAL_LINES"

          echo "public_code_lines=$TOTAL_LINES" >> "$GITHUB_OUTPUT"
          
      - name: Update telemetry SVG
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          from datetime import datetime, timezone

          path = Path("assets/statistics/development-telemetry.svg")
          svg = path.read_text(encoding="utf-8")

          public_repos = "${{ steps.stats.outputs.public_repos }}"
          private_repos = "${{ steps.stats.outputs.private_repos }}"
          total_repos = "${{ steps.stats.outputs.total_repos }}"
          featured_projects = "${{ steps.stats.outputs.featured_projects }}"
          projects_built = "${{ steps.stats.outputs.projects_built }}"

          last_sync = datetime.now(timezone.utc).strftime("%d %b %Y").upper()

          # PUBLIC REPOSITORIES
          svg = re.sub(
              r'(<text\s+x="30"\s+y="184"[\s\S]*?>)[\s\S]*?(</text>)',
              rf'\g<1>\n    {public_repos}\n  \g<2>',
              svg,
              count=1
          )

          # PRIVATE REPOSITORIES
          svg = re.sub(
              r'(<text\s+x="245"\s+y="184"[\s\S]*?>)[\s\S]*?(</text>)',
              rf'\g<1>\n    {private_repos}\n  \g<2>',
              svg,
              count=1
          )

          # TOTAL REPOSITORIES
          svg = re.sub(
              r'(<text\s+x="480"\s+y="184"[\s\S]*?>)[\s\S]*?(</text>)',
              rf'\g<1>\n    {total_repos}\n  \g<2>',
              svg,
              count=1
          )

          # FEATURED PROJECTS
          svg = re.sub(
              r'(<text\s+id="featured-projects-value"[\s\S]*?>)[\s\S]*?(</text>)',
              rf'\g<1>\n    {featured_projects}\n  \g<2>',
              svg,
              count=1
          )

          # PROJECTS BUILT
          svg = re.sub(
              r'(<text\s+x="30"\s+y="310"[\s\S]*?>)[\s\S]*?(</text>)',
              rf'\g<1>\n    {projects_built}\n  \g<2>',
              svg,
              count=1
          )

          # LAST SYNC
          svg = re.sub(
              r'(<text\s+x="700"\s+y="310"[\s\S]*?>)[\s\S]*?(</text>)',
              rf'\g<1>\n    {last_sync}\n  \g<2>',
              svg,
              count=1
          )

          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit updated statistics
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No telemetry changes detected."
            exit 0
          fi

          git config user.name "ObserverMT Telemetry"
          git config user.email "actions@users.noreply.github.com"

          git add assets/statistics/development-telemetry.svg
          git commit -m "Update development telemetry"
          git push
