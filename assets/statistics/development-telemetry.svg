<svg width="900" height="390" viewBox="0 0 900 390"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="title desc">

  <title id="title">ObserverMT Development Telemetry</title>
  <desc id="desc">Development and GitHub statistics for ObserverMT</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="898"
    height="388"
    rx="14"
    fill="url(#background)"
    stroke="#30363d"
    stroke-width="2"
  />

  <!-- Top accent -->
  <rect x="30" y="28" width="48" height="3" rx="1.5" fill="#22d3ee">
    <animate
      attributeName="width"
      from="0"
      to="48"
      dur="0.8s"
      fill="freeze"
    />
  </rect>

  <!-- Header -->
  <text
    x="30"
    y="62"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="22"
    font-weight="700">
    OBSERVERMT
  </text>

  <text
    x="30"
    y="84"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11"
    letter-spacing="2">
    DEVELOPMENT ARCHIVE // TELEMETRY
  </text>

  <!-- Status -->
  <circle
    cx="758"
    cy="55"
    r="5"
    fill="#22d3ee"
    filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="2.4s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="774"
    y="59"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11"
    letter-spacing="1">
    LIVE DATA
  </text>

  <!-- Divider -->
  <line
    x1="30"
    y1="110"
    x2="870"
    y2="110"
    stroke="#21262d"
  />

  <!-- GitHub label -->
  <text
    x="30"
    y="142"
    fill="#22d3ee"
    font-family="Consolas, Monaco, monospace"
    font-size="11"
    font-weight="700"
    letter-spacing="2">
    GITHUB
  </text>

  <!-- Public repos -->
  <text
    x="30"
    y="184"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="30"
    font-weight="700">
    02
  </text>

  <text
    x="30"
    y="207"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    PUBLIC REPOSITORIES
  </text>

  <!-- Private repos -->
  <text
    x="245"
    y="184"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="30"
    font-weight="700">
    53
  </text>

  <text
    x="245"
    y="207"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    PRIVATE REPOSITORIES
  </text>

  <!-- Total repos -->
  <text
    x="480"
    y="184"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="30"
    font-weight="700">
    55
  </text>

  <text
    x="480"
    y="207"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    TOTAL REPOSITORIES
  </text>

   <text
    id="featured-projects-value"
    x="700"
    y="184"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="30"
    font-weight="700">
    02
  </text>

  <text
    x="700"
    y="207"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    FEATURED PROJECTS
  </text>

  <!-- Divider -->
  <line
    x1="30"
    y1="236"
    x2="870"
    y2="236"
    stroke="#21262d"
  />

  <!-- Development label -->
  <text
    x="30"
    y="268"
    fill="#22d3ee"
    font-family="Consolas, Monaco, monospace"
    font-size="11"
    font-weight="700"
    letter-spacing="2">
    DEVELOPMENT
  </text>

  <!-- Projects -->
  <text
    x="30"
    y="310"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="26"
    font-weight="700">
    17
  </text>

  <text
    x="30"
    y="333"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    PROJECTS BUILT
  </text>

  <!-- Lines of code -->
  <text
    id="public-code-lines-value"
    x="245"
    y="310"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="26"
    font-weight="700">
    2.7K
  </text>

  <text
    x="245"
    y="333"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    PUBLIC CODE LINES
  </text>

  <!-- Status -->
  <text
    x="480"
    y="310"
    fill="#22d3ee"
    font-family="Consolas, Monaco, monospace"
    font-size="18"
    font-weight="700">
    ACTIVE
  </text>

  <text
    x="480"
    y="333"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    ARCHIVE STATUS
  </text>

  <!-- Sync -->
  <text
    x="700"
    y="310"
    fill="#f0f6fc"
    font-family="Consolas, Monaco, monospace"
    font-size="14">
    23 SEP 2026
  </text>

  <text
    x="700"
    y="333"
    fill="#8b949e"
    font-family="Consolas, Monaco, monospace"
    font-size="11">
    LAST SYNC
  </text>

  <!-- Footer -->
  <text
    x="30"
    y="368"
    fill="#484f58"
    font-family="Consolas, Monaco, monospace"
    font-size="9"
    letter-spacing="1">
    OBSERVERMT // SYSTEM GENERATED DEVELOPMENT RECORD
  </text>

</svg>
